<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Philips Home Access – Connect to SmartThings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: #0070c9;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.3rem;
    }

    .logo-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a2e;
      line-height: 1.2;
    }

    .logo-sub {
      font-size: 0.78rem;
      color: #666;
      font-weight: 400;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 0.35rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1.75rem;
    }

    .error-box {
      background: #fff0f0;
      border: 1px solid #f5c6c6;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #c0392b;
      font-size: 0.88rem;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #333;
      margin-bottom: 0.35rem;
    }

    input, select {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1a1a2e;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1rem;
    }

    input:focus, select:focus {
      border-color: #0070c9;
      box-shadow: 0 0 0 3px rgba(0,112,201,0.12);
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #0070c9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.25rem;
    }

    button:hover { background: #005fa3; }
    button:active { background: #004f8a; }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #888;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">&#128274;</div>
      <div class="logo-text">
        Philips Home Access
        <div class="logo-sub">SmartThings Integration</div>
      </div>
    </div>

    <h1>Sign in to your account</h1>
    <p class="subtitle">
      Enter your Philips Home Access credentials to link your locks with
      SmartThings.
    </p>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('oauth_authorize_post') }}">
      <label for="username">Email address</label>
      <input
        type="email"
        id="username"
        name="username"
        placeholder="you@example.com"
        required
        autocomplete="email"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        required
        autocomplete="current-password"
      />

      <label for="region">Region</label>
      <select id="region" name="region" required>
        {% for region in regions %}
        <option value="{{ region }}">{{ region }}</option>
        {% endfor %}
      </select>

      <button type="submit">Connect to SmartThings</button>
    </form>

    <div class="footer">
      Your credentials are sent directly to Philips servers and are never
      stored by this connector.
    </div>
  </div>
</body>
</html>
